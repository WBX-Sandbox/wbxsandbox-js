# Publishes the package to npm when a GitHub release is published.
# npm trusted publishing (OIDC), staged: no npm token is stored in GitHub; every version is
# approved with 2FA on npmjs.com. See PUBLISHING.md.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # required: GitHub issues the OIDC token that npm exchanges for a publish credential

jobs:
  publish:
    runs-on: ubuntu-latest # trusted publishing works only on GitHub-hosted runners
    # Optional: set the same environment name in the npm trusted publisher settings and add
    # required reviewers to it in GitHub (Settings → Environments) for a manual approval step.
    environment: npm
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # trusted publishing needs npm CLI 11.5.1 or newer, `npm stage publish` npm 12;
      # Node.js 22 ships npm 10
      - run: npm install -g npm@^12
      - run: npm --version

      - name: Check that the tag matches package.json
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::release tag $TAG does not match package.json version $VERSION (expected v$VERSION)"
            exit 1
          fi
          SRC=$(node -e "const m=require('fs').readFileSync('src/version.ts','utf8').match(/VERSION = \"([^\"]+)\"/); console.log(m && m[1])")
          if [ "$SRC" != "$VERSION" ]; then
            echo "::error::src/version.ts ($SRC) does not match package.json ($VERSION)"
            exit 1
          fi

      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm pack --dry-run

      - name: Stage the release on npm
        # Trusted publisher allows only `npm stage publish`: a maintainer approves every
        # version with 2FA at npmjs.com → Staged Packages before it becomes public.
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG=latest
          case "$VERSION" in *-*) TAG=next ;; esac
          npm stage publish --provenance --access public --tag "$TAG"
          echo "::notice::wbxsandbox $VERSION is staged – approve it at https://www.npmjs.com → Staged Packages"
